name: ORBIS Admin Candidate Runtime Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbis-admin-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staging-verification:
    # Legacy required context retained; this now verifies an isolated CI runtime.
    name: Staging Verification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build candidate
        run: npm run build
      - name: Verify isolated candidate health, account assets and registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUNTIME'
          from pathlib import Path
          import json, os, re, signal, socket, subprocess, time, urllib.request
          root = Path.cwd()
          job = root / '.runtime-evidence'
          job.mkdir(exist_ok=True)
          port = 4188
          with socket.socket() as probe: probe.bind(('127.0.0.1', port))
          log_path = job / 'admin-runtime.log'
          log = log_path.open('w')
          server = subprocess.Popen(['npm', 'start'], cwd=root, env={**os.environ, 'PORT': str(port), 'RENDER_GIT_COMMIT': os.environ['CANDIDATE_SHA']}, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)

          def interrupted(_number, _frame): raise SystemExit('Runtime check interrupted')
          signal.signal(signal.SIGTERM, interrupted)

          def get(path, timeout):
              start = time.monotonic()
              print('LOCAL_REQUEST=' + path + ' TIMEOUT_SECONDS=' + str(timeout), flush=True)
              with urllib.request.urlopen('http://127.0.0.1:' + str(port) + path, timeout=timeout) as response:
                  raw = response.read(2000000)
                  if response.status != 200: raise RuntimeError('Unexpected status')
              print('LOCAL_HTTP=200 PATH=' + path + ' ELAPSED_SECONDS=' + str(round(time.monotonic() - start, 2)), flush=True)
              return raw

          try:
              for _ in range(40):
                  if server.poll() is not None: raise RuntimeError('Admin exited before readiness')
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:' + str(port) + '/health', timeout=2) as response:
                          health = json.load(response)
                      break
                  except OSError: time.sleep(0.5)
              else: raise RuntimeError('Admin not ready')
              if health.get('status') != 'ok' or health.get('service') != 'orbis-admin-api' or health.get('revision') != os.environ['CANDIDATE_SHA']:
                  raise RuntimeError('Health contract failed')
              print('LOCAL_HEALTH=PASS', flush=True)
              html = get('/account', 10).decode()
              if '<html' not in html.lower(): raise RuntimeError('Account HTML missing')
              assets = re.findall(r'src="(/assets/[^"\s]+\.js)"', html)
              if not assets: raise RuntimeError('Built client entry missing')
              for asset in assets:
                  if not get(asset, 10): raise RuntimeError('Client asset empty')
              print('LOCAL_ACCOUNT_HTML_AND_CLIENT_ASSET=PASS', flush=True)
              config = json.loads(get('/api/v1/customer/config', 10))
              if not isinstance(config.get('available'), bool): raise RuntimeError('Customer configuration contract invalid')
              print('DISPOSABLE_RUNTIME_CUSTOMER_AVAILABLE=' + str(config['available']) + '; NO_AUTH_SECRETS_LOADED', flush=True)
              # Registry enrichment performs real public GitHub/Render reads. Keep it an
              # explicit network-dependent check, with measured latency and no hidden retry.
              projects = json.loads(get('/api/v1/projects', 60))
              if projects.get('schemaVersion') != 'v1' or not isinstance(projects.get('projects'), list):
                  raise RuntimeError('Registry response contract failed')
              print('LOCAL_REGISTRY=PASS; PROJECT_COUNT=' + str(len(projects['projects'])), flush=True)
              print('LOCAL_RUNTIME_SMOKE=PASS; NO_REAL_USER_AUTH_OR_PROFILE_SAVE_ATTEMPTED', flush=True)
          except BaseException:
              print('LOCAL_RUNTIME_SMOKE=NOT_PASSED; EARLIER_TESTS_AND_BUILD_REMAIN_VALID', flush=True)
              try:
                  started = time.monotonic()
                  with urllib.request.urlopen('https://api.github.com/repos/orbisaideveloper/orbis-admin/branches/main', timeout=10) as response:
                      print('PUBLIC_GITHUB_CONNECTIVITY_HTTP=' + str(response.status), flush=True)
                  print('PUBLIC_GITHUB_CONNECTIVITY_SECONDS=' + str(round(time.monotonic() - started, 2)), flush=True)
              except (OSError, ValueError) as error:
                  print('PUBLIC_GITHUB_CONNECTIVITY_ERROR=' + type(error).__name__, flush=True)
              raise
          finally:
              try: os.killpg(server.pid, signal.SIGTERM)
              except ProcessLookupError: pass
              try: server.wait(timeout=8)
              except subprocess.TimeoutExpired: pass
              try: os.killpg(server.pid, signal.SIGKILL)
              except ProcessLookupError: pass
              server.wait(); log.close()
              print('LOCAL_SERVER_LOG_BEGIN', flush=True)
              print(log_path.read_text()[-16000:], flush=True)
              print('LOCAL_SERVER_LOG_END; OWN_SERVER_STOPPED', flush=True)
          PY_RUNTIME
      - name: Preserve runtime server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-candidate-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: .runtime-evidence/admin-runtime.log
          if-no-files-found: ignore
          retention-days: 7
