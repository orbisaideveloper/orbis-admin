name: ORBIS Admin Workflow Syntax Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/validate-workflows.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-syntax:
    name: Workflow Syntax Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate GitHub Workflow Structure
        run: node scripts/validate-workflows.mjs

      - name: Validate Sonar Diagnostic Shell
        run: bash -n scripts/sonar-diagnostic.sh
