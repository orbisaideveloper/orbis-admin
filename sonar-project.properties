sonar.projectKey=orbisaideveloper_orbis-admin
sonar.organization=orbis
sonar.projectName=orbis-admin
sonar.sourceEncoding=UTF-8

# Scan the repository from the root so future app layouts are covered without
# having to guess a framework-specific source directory before app code exists.
sonar.sources=.

# Test files are analyzed as tests rather than production sources.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.next/**,**/.git/**,**/.orbis-backup/**,**/*.test.*,**/*.spec.*
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/src/test/**

# CI must generate LCOV before Sonar analysis once application code exists.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
