sonar.projectKey=orbisaideveloper_orbis-admin
sonar.organization=orbis
sonar.projectName=orbis-admin
sonar.sourceEncoding=UTF-8

# Analyse the full repository for quality/security issues.
sonar.sources=.

# Tests remain tests, not production sources.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.next/**,**/.git/**,**/.orbis-backup/**,**/*.test.*,**/*.spec.*
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/src/test/**

# Runtime coverage is 100%. Tooling/configuration remains quality-scanned
# but is not production runtime coverage.
sonar.coverage.exclusions=scripts/**,.github/**,eslint.config.js,vitest.config.ts,vitest.setup.ts,**/vite.config.ts,**/*.d.ts,database/migrations/**/*.sql

# Database migrations remain quality/security-scanned. V8/LCOV cannot execute
# PostgreSQL DDL, so they are excluded only from JavaScript runtime coverage.
# Declarative SQL necessarily repeats approved lifecycle/assurance literals;
# suppress only that non-security PLSQL rule for versioned migrations.
sonar.issue.ignore.multicriteria=identityMigrationSqlLiterals
sonar.issue.ignore.multicriteria.identityMigrationSqlLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.identityMigrationSqlLiterals.resourceKey=database/migrations/**/*.sql

# Runtime duplication is required to remain 0.00%.
# CI/workflow/configuration boilerplate is still quality-scanned separately.
sonar.cpd.exclusions=scripts/**,.github/**,eslint.config.js,vitest.config.ts,vitest.setup.ts,**/vite.config.ts,**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
